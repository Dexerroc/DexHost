[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/dexhost-api/:splat"
  status = 200

[[redirects]]
  from = "https://:site.dexhost.de/*"
  to = "/s/:site/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
